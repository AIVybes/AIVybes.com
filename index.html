<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIVybes</title>
    <style>
        /* Basic styles for improved UX */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .search-container {
            margin-bottom: 20px;
        }
        .error {
            color: red;
            display: none; /* Hidden by default */
        }
    </style>
</head>
<body>
    <h1>AIVybes Search</h1>
    <div class="search-container">
        <input type="text" id="search" aria-label="Search" placeholder="Search..." />
        <span class="error" id="error-message">No results found. Please try a different query.</span>
        <select id="category-filter" aria-label="Filter by category">
            <option value="">All Categories</option>
            <option value="category1">Category 1</option>
            <option value="category2">Category 2</option>
        </select>
    </div>
    <ul id="results-list" role="list" aria-live="polite"></ul>

    <script>
        const searchInput = document.getElementById('search');
        const categoryFilter = document.getElementById('category-filter');
        const resultsList = document.getElementById('results-list');
        const errorMessage = document.getElementById('error-message');

        const data = [
            // Sample data items
            { name: 'Item 1', category: 'category1' },
            { name: 'Item 2', category: 'category2' },
            // Additional data...
        ];

        function filterResults() {
            const query = searchInput.value.toLowerCase();
            const category = categoryFilter.value;
            resultsList.innerHTML = '';
            let filteredData = data;

            if (category) {
                filteredData = filteredData.filter(item => item.category === category);
            }

            const results = filteredData.filter(item => 
                item.name.toLowerCase().includes(query)
            );

            if (results.length > 0) {
                errorMessage.style.display = 'none';
                results.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = item.name;
                    resultsList.appendChild(li);
                });
            } else {
                errorMessage.style.display = 'block';
            }
        }

        searchInput.addEventListener('input', filterResults);
        categoryFilter.addEventListener('change', filterResults);
    </script>
</body>
</html>
